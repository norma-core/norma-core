IMAGE_NAME=yahboom-dogzilla-lite
IMAGE_PLATFORM=linux/arm64
SOURCE_TYPE=disk-image

BASE_IMAGE_URL="${RASPBERRYPI_OS_5_URL:-https://downloads.raspberrypi.com/raspios_lite_arm64/images/raspios_lite_arm64-2026-04-21/2026-04-21-raspios-trixie-arm64-lite.img.xz}"
BASE_IMAGE_SHA256="${RASPBERRYPI_OS_5_SHA256:-4cd31df026fd82243805a326dc0cafd7383f7e3d30c9413e7044d507aae281e2}"
BASE_IMAGE_FORMAT=xz
BASE_IMAGE_ARCHIVE="${REPO_ROOT}/target/image-maker/raspberrypi-os-5/raspberrypi-os-lite.img.xz"
BASE_IMAGE_RAW="${REPO_ROOT}/target/images/raspberrypi-os-5.img"

BOOT_PARTITION_NUMBER=1
ROOT_PARTITION_NUMBER=2

# Architecture knobs forwarded to image.dockerfile as --build-args. These mirror
# the dockerfile's arm64 defaults; change them (with matching checksums) to target
# a different architecture. See README "Adding a non-arm64 image".
OVERLAY_BUILD_ARGS=(
  "UV_TARGET=aarch64-unknown-linux-gnu"
  "UV_SHA256=f8e23ec786b18660ade6b033b6191b7e9c283c872eeb8c4531d56a873decf160"
  "TAILSCALE_ARCH=arm64"
  "TAILSCALE_SHA256=d26ce4a1a259621fc76d16c7baf3f3a4252f356dfa9d9769484782f766ca1b7f"
)

ENABLE_SYSTEMD_UNITS=(
  tailscaled.service
  firstboot-setup.service
  station.service
  yahboom-dogzilla-lite-monitor.service
)
