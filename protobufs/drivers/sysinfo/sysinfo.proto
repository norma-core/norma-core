syntax = "proto3";

package sysinfo;

message Envelope {
    uint64 monotonic_stamp_ns = 1;
    uint64 local_stamp_ns     = 2;
    uint64 app_start_id       = 3;

    EnvelopeData data = 10;
}

message InferenceStatePtr {
    repeated bytes rx_ptrs = 10;
}

message EnvelopeData {
    OsInfo      os          = 1;
    TimeInfo    time        = 2;
    Memory      memory      = 3;
    Motherboard motherboard = 4;
    string      hostname    = 5;
    string      cpu_arch    = 6;
    uint64      physical_core_count = 7;
    string      name                = 8;
    string      unique_id           = 9;
    
    repeated User    users    = 10;
    repeated CPU     cpu      = 11;
    repeated Disk    disks    = 12;
    repeated Network networks = 13;
    repeated ProcessInfo processes = 15;

    repeated TemperatureSensor temperatures = 20;
    repeated PowerSource       power_sources = 21;
    ThrottlingState            throttling    = 22;
    repeated CellularModem     cellular_modems = 30;
}

message OsInfo {
    string name           = 1;
    string release        = 2;
    string kernel_version = 3;
}

message TimeInfo {
    int64 utc_offset_seconds = 1;
}

message Memory {
    uint64 total_bytes = 1;
    uint64 used_bytes  = 2;

    uint64 total_swap_bytes = 3;
    uint64 used_swap_bytes  = 4;
}

message CPU {
    string name      = 1;
    string vendor_id = 2;
    string brand     = 3;
    uint64 frequency = 4;

    float  usage = 10;
}

message Disk {
    string kind        = 1;
    string fs          = 2;
    string name        = 3;
    string mount_point = 4;
    bool   removable   = 5;
    bool   read_only   = 6;

    uint64 total_space_bytes     = 10;
    uint64 available_space_bytes = 11;

    uint64 total_read_bytes    = 20;
    uint64 total_written_bytes = 21;
}

message Motherboard {
    string name          = 1;
    string vendor_name   = 2;
    string version       = 3;
    string serial_number = 4;
    string asset_tag     = 5;
}

message User {
    string name = 1;

    repeated string groups = 10;
}

message NetworkIp {
    string addr   = 1;
}

message Network {
    string iface = 1;
    string mac_address = 2;

    repeated NetworkIp ips = 10;
    
    uint64 bytes_received      = 20;
    uint64 bytes_transmitted   = 21;
    uint64 packets_received    = 22;
    uint64 packets_transmitted = 23;
    uint64 errors_received     = 24;
    uint64 errors_transmitted  = 25;
}

message ProcessInfo {
    uint32 pid        = 1;
    int64  parent_pid = 2;
    string name       = 3;
    string exe        = 4;
    repeated string cmd = 5;
    string cwd        = 6;
    string kind       = 7;
    string status     = 8;
    string user_name  = 9;

    int64  uid        = 10;
    int64  gid        = 11;
    int64  session_id = 12;
    uint64 start_time_epoch_seconds = 13;
    uint64 run_time_seconds         = 14;
    uint32 thread_count             = 15;

    float  cpu_usage             = 20;
    uint64 memory_bytes          = 21;
    uint64 virtual_memory_bytes  = 22;
    uint64 accumulated_cpu_time_ms = 23;

    uint64 total_read_bytes    = 30;
    uint64 total_written_bytes = 31;
    uint64 read_bytes          = 32;
    uint64 written_bytes       = 33;
}

message TemperatureSensor {
    string id    = 1;
    string name  = 2;
    float  value = 3;
    
    float  max      = 10;
    float  critical = 11;
}

message PowerSourceAttribute {
    string key   = 1;
    string value = 2;
}

message PowerSource {
    string name = 1;

    repeated PowerSourceAttribute attributes = 10;
}

message RpiThrottling {
    uint32 raw = 1;

    bool under_voltage        = 10;
    bool arm_frequency_capped = 11;
    bool throttled            = 12;
    bool soft_temp_limit      = 13;

    bool under_voltage_since_boot        = 20;
    bool arm_frequency_capped_since_boot = 21;
    bool throttled_since_boot            = 22;
    bool soft_temp_limit_since_boot      = 23;
}

message CoolingDevice {
    string name = 1;
    string type = 2;

    uint64 cur_state = 10;
    uint64 max_state = 11;
}

message CpuFreqPolicy {
    string name             = 1;
    string scaling_governor = 2;

    uint64 scaling_cur_freq_khz = 10;
    uint64 scaling_min_freq_khz = 11;
    uint64 scaling_max_freq_khz = 12;
    uint64 cpuinfo_min_freq_khz = 13;
    uint64 cpuinfo_max_freq_khz = 14;
}

message ThrottlingState {
    RpiThrottling rpi                 = 1;
    bool          thermally_throttled = 2;

    repeated CoolingDevice cooling_devices  = 10;
    repeated CpuFreqPolicy cpufreq_policies = 11;
}

message CellularAttribute {
    string key   = 1;
    string value = 2;
}

message CellularError {
    uint64 monotonic_stamp_ns = 1;
    uint64 local_stamp_ns     = 2;
    uint64 app_start_id       = 3;

    string scope   = 10;
    string path    = 11;
    string message = 12;
    int32  exit_code = 13;
    bool   timed_out = 14;
}

message CellularIpConfig {
    string family  = 1;
    string method  = 2;
    string address = 3;
    uint32 prefix  = 4;
    string gateway = 5;
    repeated string dns = 6;

    repeated CellularAttribute attributes = 100;
}

message CellularBearer {
    uint64 monotonic_stamp_ns = 1;
    uint64 local_stamp_ns     = 2;
    uint64 app_start_id       = 3;

    string path        = 10;
    string bearer_id   = 11;
    string type        = 12;
    bool   connected   = 13;
    bool   suspended   = 14;
    bool   multiplexed = 15;
    string interface   = 16;
    uint32 ip_timeout_seconds = 17;
    int32  profile_id  = 18;

    string apn      = 20;
    string apn_type = 21;
    string roaming  = 22;

    repeated CellularIpConfig ip = 30;
    repeated CellularAttribute attributes = 100;
}

message CellularSignal {
    uint64 monotonic_stamp_ns = 1;
    uint64 local_stamp_ns     = 2;
    uint64 app_start_id       = 3;

    string access_tech = 10;
    repeated CellularAttribute metrics = 20;
}

message CellularModem {
    uint64 monotonic_stamp_ns = 1;
    uint64 local_stamp_ns     = 2;
    uint64 app_start_id       = 3;

    string path        = 10;
    string modem_id    = 11;
    string manufacturer = 12;
    string model       = 13;
    string firmware_revision = 14;
    string hardware_revision = 15;
    string carrier_config = 16;
    string equipment_id = 17;
    string device_id   = 18;

    string device      = 20;
    string physdev     = 21;
    string drivers     = 22;
    string plugin      = 23;
    string primary_port = 24;
    string ports       = 25;

    string state       = 30;
    string failed_reason = 31;
    string power_state = 32;
    string access_tech = 33;
    uint32 signal_quality_percent = 34;
    bool signal_quality_recent = 35;

    string imei        = 40;
    string operator_id = 41;
    string operator_name = 42;
    string registration = 43;
    string packet_service_state = 44;
    string primary_sim_path = 45;
    string own_numbers = 46;

    repeated CellularBearer bearers = 60;
    repeated CellularSignal signals = 61;
    repeated CellularAttribute attributes = 100;
    repeated CellularError errors = 101;
}
