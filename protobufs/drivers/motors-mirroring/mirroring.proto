syntax = "proto3";

package motors_mirroring;

enum BusType {
    MBT_ST3215 = 0;
}

enum BusMode {
    BR_UNKNOWN  = 0;
    BR_LEADER   = 1;
    BR_FOLLOWER = 2;
}

message MirroringBus {
    BusType type      = 1;
    string  unique_id = 2;
}

message ModeEnvelope {
    uint64 monotonic_stamp_ns = 1;
    uint64 local_stamp_ns     = 2;
    uint64 app_start_id       = 3;

    MirroringBus bus  = 4;
    BusMode      mode = 5;
}

enum CommandType {
    CT_START_MIRROR = 0;
    CT_STOP_MIRROR  = 1;
}

message Command {
    CommandType  type   = 1;
    MirroringBus source = 2;
    
    repeated MirroringBus targets = 10;
}

message TxEnvelope {
    uint64 monotonic_stamp_ns = 1;
    uint64 local_stamp_ns     = 2;
    uint64 app_start_id       = 3;

    Command command = 10;
}

message RxEnvelope {
    uint64 monotonic_stamp_ns = 1;
    uint64 local_stamp_ns     = 2;
    uint64 app_start_id       = 3;

    InferenceState state   = 10;
    Command        command = 11;

    GravityCompCommand gravity_command = 12;
    PwmGravityCompCommand pwm_gravity_command = 13;
}

message InferenceState {
    message Bus {
        MirroringBus id   = 1;
        BusMode      mode = 2;
    }

    message Mirroring {
        Bus source = 1;

        repeated Bus targets = 10;
    }

    repeated Bus       modes     = 10;
    repeated Mirroring mirroring = 11;

    repeated GravityCompBusState gravity_comp = 12;
    repeated PwmGravityCompBusState pwm_gravity_comp = 13;
}

// Gravity compensation is an orthogonal per-bus flag, independent of BusMode:
// a bus can be BR_LEADER (mirroring source) and gravity-comp-enabled at the
// same time, so this is modeled as its own enum/messages rather than a new
// BusMode variant.
enum GravityCompState {
    GC_UNKNOWN  = 0;
    GC_DISABLED = 1;
    GC_ENABLED  = 2;
}

message GravityCompModeEnvelope {
    uint64 monotonic_stamp_ns = 1;
    uint64 local_stamp_ns     = 2;
    uint64 app_start_id       = 3;

    MirroringBus     bus   = 4;
    GravityCompState state = 5;
}

enum GravityCompCommandType {
    GCT_START_GRAVITY_COMP = 0;
    GCT_STOP_GRAVITY_COMP  = 1;
    // Live-updates the gain of one arm joint on an already-running
    // gravity-comp task, without restarting it. Requires motor_id and
    // gain_rad_per_nm. No-op (logged) if gravity comp isn't running on `bus`.
    GCT_SET_GAIN           = 2;
    // Live-updates the torque limit (applies to all 7 arm motors), without
    // restarting. Requires torque_limit. Unlike gain (a pure software
    // multiplier), this re-sends the TorqueLimit register write immediately.
    GCT_SET_TORQUE_LIMIT   = 3;
    // Persists the bus's current per-joint gains and torque limit (whether
    // running or not) so they're pre-filled as defaults next time gravity
    // comp is started on this bus, surviving a station restart. This is
    // display/pre-fill data only - saving never re-arms gravity comp itself.
    GCT_SAVE_SETTINGS      = 4;
}

message GravityCompCommand {
    GravityCompCommandType type = 1;
    MirroringBus            bus  = 2;

    // GCT_SET_GAIN: the new gain for `motor_id`. Hard-clamped server-side
    // regardless of what's sent (see GRAVITY_COMP_GAIN_CEILING).
    optional double gain_rad_per_nm = 3;

    // GCT_SET_GAIN: which arm motor (1-7) `gain_rad_per_nm` applies to.
    optional uint32 motor_id = 4;

    // GCT_SET_TORQUE_LIMIT: the new torque limit for all 7 arm motors.
    // Hard-clamped server-side (see GRAVITY_COMP_TORQUE_LIMIT_CEILING).
    optional uint32 torque_limit = 5;
}

message GravityCompBusState {
    MirroringBus     id    = 1;
    GravityCompState state = 2;

    // Per-joint gains for the 7 arm motors, index 0..6 = rev_motor_01..07.
    // Reflects live values while running, or the last-saved values
    // (GCT_SAVE_SETTINGS) otherwise, so the UI has something sensible to
    // show/edit even before gravity comp is started.
    repeated double joint_gains_rad_per_nm = 4;

    // Torque limit for all 7 arm motors - live value while running, or the
    // last-saved value otherwise.
    optional uint32 torque_limit = 5;
}

// Persisted per-bus gravity-comp tuning (motors_mirroring/gravity_comp_settings
// queue). Restored on startup for display/pre-fill only - never re-arms
// gravity comp itself, matching GravityCompModeEnvelope's restore semantics.
message GravityCompSettingsEnvelope {
    uint64 monotonic_stamp_ns = 1;
    uint64 local_stamp_ns     = 2;
    uint64 app_start_id       = 3;

    MirroringBus    bus                     = 4;
    repeated double joint_gains_rad_per_nm  = 5;
    uint32          torque_limit             = 6;
}

// PWM (open-loop) gravity compensation: a direct feedforward-torque
// alternative to the position-offset approach above, switching the servo's
// Mode register to open-loop PWM instead of nudging GoalPosition. Reuses
// GravityCompState (generic enabled/disabled) rather than duplicating it.
// Modeled the same way as the offset-based feature - an orthogonal per-bus
// flag, its own dedicated command type (STC_PWM_GRAVITY_COMP_COMMAND) to
// avoid proto3 decode ambiguity between different message shapes on the same
// wire type - and is mutually exclusive with GravityCompCommand on the same
// bus (both actively drive the same servos' registers; see
// gravity_comp_pwm::CLAUDE.md).
message PwmGravityCompModeEnvelope {
    uint64 monotonic_stamp_ns = 1;
    uint64 local_stamp_ns     = 2;
    uint64 app_start_id       = 3;

    MirroringBus     bus   = 4;
    GravityCompState state = 5;
}

enum PwmGravityCompCommandType {
    PGCT_START_PWM_GRAVITY_COMP = 0;
    PGCT_STOP_PWM_GRAVITY_COMP  = 1;
    // Live-updates the duty-per-Nm gain of one arm joint on an already-running
    // PWM gravity-comp task, without restarting it. Requires motor_id and
    // duty_per_nm. No-op (logged) if PWM gravity comp isn't running on `bus`.
    PGCT_SET_DUTY_GAIN          = 2;
    // Live-updates the max duty (applies to all 7 arm motors), without
    // restarting. Requires max_duty.
    PGCT_SET_MAX_DUTY           = 3;
    // Persists the bus's current per-joint duty gains and max duty (whether
    // running or not) so they're pre-filled as defaults next time PWM gravity
    // comp is started on this bus, surviving a station restart. This is
    // display/pre-fill data only - saving never re-arms it.
    PGCT_SAVE_SETTINGS          = 4;
}

message PwmGravityCompCommand {
    PwmGravityCompCommandType type = 1;
    MirroringBus              bus  = 2;

    // PGCT_SET_DUTY_GAIN: the new duty-per-Nm gain for `motor_id`.
    // Hard-clamped server-side (see PWM_GRAVITY_COMP_DUTY_GAIN_CEILING).
    optional double duty_per_nm = 3;

    // PGCT_SET_DUTY_GAIN: which arm motor (1-7) `duty_per_nm` applies to.
    optional uint32 motor_id = 4;

    // PGCT_SET_MAX_DUTY: the new max duty for all 7 arm motors.
    // Hard-clamped server-side (see PWM_GRAVITY_COMP_MAX_DUTY_CEILING).
    optional uint32 max_duty = 5;
}

message PwmGravityCompBusState {
    MirroringBus     id    = 1;
    GravityCompState state = 2;

    // Per-joint duty gains for the 7 arm motors, index 0..6 = rev_motor_01..07.
    // Reflects live values while running, or the last-saved values
    // (PGCT_SAVE_SETTINGS) otherwise.
    repeated double joint_duty_gains = 4;

    // Max duty for all 7 arm motors - live value while running, or the
    // last-saved value otherwise.
    optional uint32 max_duty = 5;
}

// Persisted per-bus PWM-gravity-comp tuning
// (motors_mirroring/pwm_gravity_comp_settings queue). Restored on startup for
// display/pre-fill only - never re-arms PWM gravity comp itself, matching
// PwmGravityCompModeEnvelope's restore semantics.
message PwmGravityCompSettingsEnvelope {
    uint64 monotonic_stamp_ns = 1;
    uint64 local_stamp_ns     = 2;
    uint64 app_start_id       = 3;

    MirroringBus    bus               = 4;
    repeated double joint_duty_gains  = 5;
    uint32          max_duty          = 6;
}