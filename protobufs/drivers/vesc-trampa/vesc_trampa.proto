syntax = "proto3";

package vesc_trampa;

enum VescTrampaSignalType {
    VESC_TRAMPA_SIGNAL_TYPE_UNSPECIFIED = 0;
    VESC_TRAMPA_BOARD_CONNECT           = 1;
    VESC_TRAMPA_BOARD_DISCONNECT        = 2;
    VESC_TRAMPA_BOARD_PACKET            = 3;
    VESC_TRAMPA_COMMAND                 = 4;
    VESC_TRAMPA_COMMAND_SUCCESS         = 5;
    VESC_TRAMPA_COMMAND_REJECTED        = 6;
    VESC_TRAMPA_COMMAND_FAILED          = 7;
}

message RxEnvelope {
    uint64 monotonic_stamp_ns = 1;
    uint64 local_stamp_ns     = 2;
    uint64 app_start_id       = 3;

    VescTrampaSignalType signal_type = 10;
    VescTrampaBoard      board       = 11;

    VescTrampaBoardPacket board_packet = 20;

    TxEnvelope command = 30;

    string error = 50;
}

message TxEnvelope {
    uint64 monotonic_stamp_ns = 1;
    uint64 local_stamp_ns     = 2;
    uint64 app_start_id       = 5;

    bytes target_board_uuid = 3;

    bytes command_id = 4;

    VescTrampaBoardCommand     board_command = 10;
    VescTrampaMotorModeCommand motor_mode    = 11;
}

message Command {
    bytes target_board_uuid = 1;

    VescTrampaBoardCommand     board_command = 10;
    VescTrampaMotorModeCommand motor_mode    = 11;
}

message VescTrampaBoardCommand {
    bytes payload = 1;
    bool  response_expected = 2;
}

enum VescTrampaMotorMode {
    VESC_TRAMPA_MOTOR_MODE_UNSPECIFIED = 0;
    VESC_TRAMPA_MOTOR_MODE_HOLD        = 1;
}

message VescTrampaMotorModeCommand {
    VescTrampaMotorMode mode = 1;
}

message VescTrampaBoardPacket {
    uint32 start_byte  = 1;
    uint32 payload_len = 2;
    uint32 command_id  = 3;
    bytes  payload     = 4;
    uint32 crc         = 5;
    uint32 end_byte    = 6;
}

message InferenceState {
    message BoardState {
        VescTrampaBoard     board      = 1;
        VescTrampaMotorMode motor_mode = 2;

        uint64 monotonic_stamp_ns = 3;
        uint64 local_stamp_ns     = 4;
        uint64 app_start_id       = 5;

        bytes  values_payload            = 10;
        bytes  values_rx_pointer         = 11;
        uint64 values_monotonic_stamp_ns = 12;
        uint64 values_local_stamp_ns     = 13;
        uint64 values_app_start_id       = 14;
    }

    bytes last_inference_queue_ptr = 1;

    repeated BoardState boards = 10;
}

message VescTrampaBoard {
    string port_name      = 1;
    uint32 vid            = 2;
    uint32 pid            = 3;
    string serial_number  = 4;
    string manufacturer   = 5;
    string product        = 6;
    uint32 port_baud_rate = 7;

    uint32 firmware_major            = 20;
    uint32 firmware_minor            = 21;
    string hardware_name             = 22;
    bytes  uuid                      = 23;
    bool   pairing_done              = 24;
    uint32 test_version_number       = 25;
    uint32 hardware_type             = 26;
    uint32 custom_config_count       = 27;
    bool   has_phase_filters         = 28;
    uint32 qml_hw                    = 29;
    uint32 qml_app                   = 30;
    uint32 nrf_flags                 = 31;
    string firmware_name             = 32;
    uint32 hardware_config_crc       = 33;
    bytes  firmware_info_extra_bytes = 34;
    bytes  firmware_info_raw_payload = 35;
}
