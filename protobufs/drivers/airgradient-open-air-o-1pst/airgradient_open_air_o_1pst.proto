syntax = "proto3";

package airgradient_open_air_o_1pst;

enum AirGradientSignalType {
    AIRGRADIENT_SIGNAL_TYPE_UNSPECIFIED = 0;
    AIRGRADIENT_CONNECTED               = 1;
    AIRGRADIENT_DISCONNECTED            = 2;
    AIRGRADIENT_MEASUREMENT             = 3;
    AIRGRADIENT_ERROR                   = 4;
}

message AirGradientDevice {
    string port_name      = 1;
    uint32 vid            = 2;
    uint32 pid            = 3;
    string serial_number  = 4;
    string manufacturer   = 5;
    string product        = 6;
    uint32 port_baud_rate = 7;
    string device_id      = 8;
}

message RxEnvelope {
    uint64 monotonic_stamp_ns = 1;
    uint64 local_stamp_ns     = 2;
    uint64 app_start_id       = 3;

    AirGradientSignalType signal_type = 10;
    AirGradientDevice     device      = 11;

    // Full raw serial line, e.g. `[W][main:538]: {"pm2_5": 3, ...}`.
    // Present on CONNECTED and MEASUREMENT signals; empty otherwise.
    bytes data = 20;

    string error = 50;
}
