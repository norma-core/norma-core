    QDT_STATION_COMMANDS = 1; // commands Command
    QDT_STATION_STARTUPS  = 2; // startups.StationStartup
    QDT_INFERENCE_TAGS_RX = 3; // inference_tags.RxEnvelope

    QDT_ST3215_SERIAL_TX    = 10; // commands
    QDT_ST3215_SERIAL_RX    = 11; // states
    QDT_ST3215_META         = 12; // meta
    QDT_ST3215_INFERENCE    = 13; // inference state

    QDT_VESC_TRAMPA_SERIAL_RX = 14; // board connect/disconnect states
    QDT_VESC_TRAMPA_SERIAL_TX = 15; // commands
    QDT_VESC_TRAMPA_INFERENCE = 16; // inference state
    
    QDT_FFMPEG_VIDEO_STREAM_RX = 20; // FFMPEGQueueHeader
    QDT_USB_VIDEO_FRAMES       = 21;
    QDT_INFERENCE_FRAMES       = 22; // inference frames (normvla, etc)
    QDT_HIKMICRO_THERMAL       = 23; // hikmicro.RxEnvelope
    QDT_USB_VIDEO_TX           = 24; // usbvideo.TxEnvelope

    QDT_MOTOR_MIRRORING_MODES = 30;
    QDT_MOTOR_MIRRORING_RX    = 32;

    QDT_YAHBOOM_DOGZILLA_LITE_SERIAL_TX = 40; // yahboom_dogzilla_lite.TxEnvelope
    QDT_YAHBOOM_DOGZILLA_LITE_SERIAL_RX = 41; // yahboom_dogzilla_lite.RxEnvelope
    QDT_YAHBOOM_DOGZILLA_LITE_INFERENCE = 42; // yahboom_dogzilla_lite.InferenceState

    QDT_ARDUINO_NICLA_SENSE_ENV_TX = 50; // arduino_nicla_sense_env.TxEnvelope
    QDT_ARDUINO_NICLA_SENSE_ENV_RX = 51; // arduino_nicla_sense_env.RxEnvelope
    QDT_INA226_RX                  = 52; // ina226.RxEnvelope

    QDT_AIRGRADIENT_OPEN_AIR_O_1PST_RX = 53; // airgradient_open_air_o_1pst.RxEnvelope

    QDT_VICTRON_SMARTSOLAR_MPPT_RX = 54; // victron_smartsolar_mppt.RxEnvelope

    QDT_PWM_OUTPUT_TX = 55; // pwm_output.TxEnvelope
    QDT_PWM_OUTPUT_RX = 56; // pwm_output.RxEnvelope

    QDT_DMESG_RX = 57; // dmesg.RxEnvelope
    QDT_DFROBOT_RS485_RX = 58; // dfrobot_rs485.RxEnvelope
