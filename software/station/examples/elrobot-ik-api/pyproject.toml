[project]
name = "elrobot-ik"
version = "0.1.0"
description = "Inverse kinematics HTTP API for the ElRobot arm via a NormaCore station"
requires-python = ">=3.12,<3.13"
dependencies = [
    "placo>=0.10,<0.11",
    "numpy>=2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "websockets>=13",
    "protobuf>=6.32",
    "pydantic>=2",
    "mcp>=1.10",
]

[project.scripts]
elrobot-ik = "elrobot_ik.api.app:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "httpx>=0.27", "ruff>=0.14"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build]
artifacts = ["src/elrobot_ik/urdf/"]  # copied in by hatch_build.py and gitignored, so it needs listing to ship

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.wheel]
packages = ["src/elrobot_ik"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["error::UserWarning:google.protobuf.*", "ignore:Please update your .hppfcl. imports:DeprecationWarning", "ignore:Using .httpx. with .starlette.testclient. is deprecated"]

[tool.ruff]
line-length = 140
extend-exclude = ["src/elrobot_ik/station/proto"]  # generated with protoc from ../../../../protobufs

[tool.ruff.lint]
extend-select = ["I", "UP", "RUF"]
