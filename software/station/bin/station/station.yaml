drivers:
  st3215:
    enabled: true
    current-threshold: 100
    deadband: 20
  vesc-trampa:
    enabled: true
    port-baud-rate: 115200
  system-info: true
  usb-video:
    enabled: true
    resolution: auto      # "auto" or "<width>x<height>", e.g. "1280x720"
    resize_target: 224    # Resize shortest dimension of stored frames to 224px
    frame-skip: 0         # Drop N frames after each kept frame; 0 records every frame
  hikmicro-thermal:
    enabled: false
    frame-timeout: 5s
    frame-skip: 0         # Drop N frames after each kept frame; 0 records every frame
  yahboom-dogzilla-lite:
    enabled: true
    mode: simulation
  arduino-nicla-sense-me:
    enabled: true
    poll-interval: 1s
    boards:
      - id: nicla-usb
        bus-type: usb     # autodetected by USB vid/pid 2341:0060
        poll-interval: 10ms  # ~100 Hz live stream (storage: ~2.3 GB/day)
      # - id: nicla-i2c
      #   bus-type: i2c
      #   i2c-bus: 2      # adjust to the I2C bus the ESLOV chain is wired to
inference:
- queue-id: inference/normvla
  shm: /tmp/normvla
  shm-size-mb: 12
  format: normvla
  st3215-bus: auto
  update-interval: 100ms
