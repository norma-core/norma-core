drivers:
  st3215:
    enabled: true
    current-threshold: 100
    deadband: 20
  vesc-trampa:
    enabled: true
    port-baud-rate: 115200
  system-info: true
  usb-video:
    enabled: true
    resolution: auto      # "auto" or "<width>x<height>", e.g. "1280x720"
    resize_target: 224    # Resize shortest dimension of stored frames to 224px
    frame-skip: 0         # Drop N frames after each kept frame; 0 records every frame
  hikmicro-thermal:
    enabled: false
    frame-timeout: 5s
    frame-skip: 0         # Drop N frames after each kept frame; 0 records every frame
  yahboom-dogzilla-lite:
    enabled: true
    mode: simulation
  dfrobot-rs485:
    enabled: true
    ports: ["/dev/ttyUSB*", "/dev/cu.usbserial-*"]
    baud: 9600
    poll-interval: 1s
    sensors:
      - { model: irradiance, modbus-id: 1 }
      - { model: par,        modbus-id: 2 }
      - { model: uv,         modbus-id: 3 }
      - { model: light,      modbus-id: 4 }
inference:
- queue-id: inference/normvla
  shm: /tmp/normvla
  shm-size-mb: 12
  format: normvla
  st3215-bus: auto
  update-interval: 100ms
