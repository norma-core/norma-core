drivers:
  st3215:
    enabled: true
    current-threshold: 100
    deadband: 20
  vesc-trampa:
    enabled: true
    port-baud-rate: 115200
  system-info: true
  usb-video:
    enabled: true
    resolution: auto      # "auto" or "<width>x<height>", e.g. "1280x720"
    resize_target: 224    # Resize shortest dimension of stored frames to 224px
    frame-skip: 0         # Drop N frames after each kept frame; 0 records every frame
  hikmicro-thermal:
    enabled: false
    frame-timeout: 5s
    frame-skip: 0         # Drop N frames after each kept frame; 0 records every frame
  yahboom-dogzilla-lite:
    enabled: true
    mode: simulation
  arduino-pro-4g-gnss:
    enabled: true
    fix-frequency: 10   # NMEA rate in Hz (1/2/5/10); GSV satellite detail always 1 Hz
    # assistance: true  # gpsOneXTRA predicted ephemeris (default on; ~27 KB from izatcloud.net when stale)
inference:
- queue-id: inference/normvla
  shm: /tmp/normvla
  shm-size-mb: 12
  format: normvla
  st3215-bus: auto
  update-interval: 100ms
