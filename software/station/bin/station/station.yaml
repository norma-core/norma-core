drivers:
  st3215:
    enabled: true
    current-threshold: 100
    deadband: 20
  vesc-trampa:
    enabled: true
    port-baud-rate: 115200
  system-info: true
  usb-video:
    enabled: true
    resolution: auto      # "auto" or "<width>x<height>", e.g. "1280x720"
    resize_target: 224    # Resize shortest dimension of stored frames to 224px
    frame-skip: 0         # Drop N frames after each kept frame; 0 records every frame
  hikmicro-thermal:
    enabled: false
    frame-timeout: 5s
    frame-skip: 0         # Drop N frames after each kept frame; 0 records every frame
  yahboom-dogzilla-lite:
    enabled: true
    mode: simulation
  dfrobot-rs485:
    enabled: true
    ports: ["/dev/cu.usbserial-*", "/dev/cu.wchusbserial*", "/dev/ttyUSB*"]
    # baud: 9600          # optional fixed baud — disables baud detection
    # bauds: [4800, 9600] # optional candidate list; this is the default
    poll-interval: 1s
    # scan-ids: "1-10"   # default; auto-detect scans these IDs ("A-B" string or list like [1, 2]; quote single IDs: "5"). Models are auto-detected.
    # sensors:           # optional explicit override, skips detection:
    #   - { model: uv, modbus-id: 3 }
inference:
- queue-id: inference/normvla
  shm: /tmp/normvla
  shm-size-mb: 12
  format: normvla
  st3215-bus: auto
  update-interval: 100ms
